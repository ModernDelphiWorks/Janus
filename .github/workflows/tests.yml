# Janus Framework — CI Test Pipeline
#
# This workflow compiles and runs the DUnitX test suite (Janus.Tests.Units.dpr)
# on a self-hosted runner with Delphi installed.
#
# ─── HOW TO CONFIGURE THE SELF-HOSTED RUNNER ───
#
# 1. Install a GitHub Actions self-hosted runner on a Windows machine
#    with Embarcadero Delphi (XE or later) installed.
#    Docs: https://docs.github.com/en/actions/hosting-your-own-runners
#
# 2. Add labels "self-hosted" and "delphi" to the runner.
#
# 3. Ensure rsvars.bat is accessible. Typical path:
#    C:\Program Files (x86)\Embarcadero\Studio\<version>\bin\rsvars.bat
#
# 4. The runner must have MSBuild available (ships with Delphi RAD Studio).
#
# 5. Once the runner is online, this workflow will execute automatically
#    on push/PR to main and develop branches.
# ────────────────────────────────────────────────

name: Janus Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-dunitx:
    name: DUnitX Smoke Tests
    runs-on: [self-hosted, delphi]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Boss)
        run: |
          if (Get-Command boss -ErrorAction SilentlyContinue) {
            boss install
          } else {
            Write-Host "Boss not found — skipping dependency install. Ensure dependencies are available."
          }
        shell: pwsh

      - name: Locate Delphi environment
        id: delphi-env
        run: |
          # Try common rsvars.bat locations
          $rsvars = @(
            "C:\Program Files (x86)\Embarcadero\Studio\23.0\bin\rsvars.bat",
            "C:\Program Files (x86)\Embarcadero\Studio\22.0\bin\rsvars.bat",
            "C:\Program Files (x86)\Embarcadero\Studio\21.0\bin\rsvars.bat",
            "C:\Program Files (x86)\Embarcadero\Studio\20.0\bin\rsvars.bat",
            # Appended LAST on purpose: a runner that still has 23.0 keeps
            # using it, exactly as before. This entry only decides anything on
            # a runner where 37.0 is the ONLY Studio installed - which is the
            # case on the workstation these projects are built on today.
            "C:\Program Files (x86)\Embarcadero\Studio\37.0\bin\rsvars.bat"
          )
          foreach ($path in $rsvars) {
            if (Test-Path $path) {
              Write-Host "Found rsvars.bat at: $path"
              echo "RSVARS_PATH=$path" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }
          Write-Host "::warning::rsvars.bat not found. Compilation may fail."
          echo "RSVARS_PATH=" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # ─── WHICH PROJECTS THIS JOB GATES ───
      #
      # Janus.Tests.Units        the default configuration - DRIVERRESTFUL OFF,
      #                          which is what Janus.inc ships.
      # Janus.Tests.RESTfulDriver the OPT-IN configuration - DRIVERRESTFUL ON,
      #                          carried by its own .dproj (DCC_Define). Before
      #                          it existed, no CI run ever compiled the ON
      #                          branch of a single {$IFDEF DRIVERRESTFUL}, and
      #                          Janus.Manager.DataSet / Janus.Manager.ObjectSet
      #                          were not compiled by ANY test binary at all.
      #
      # Deliberately NOT here, and why:
      #   Janus.Tests.LiveBindings, Janus.Tests.RESTHorse - they build and pass
      #     locally but this job never ran them either; adding them is a
      #     separate decision, not a side effect of the REST configuration.
      #   Janus.Tests.RESTOracle - needs a live Oracle; its 12 tests error out
      #     without one, so it cannot be a gate on a runner without a database.
      - name: Compile and run the DUnitX projects
        run: |
          $rsvars = "${{ steps.delphi-env.outputs.RSVARS_PATH }}"
          if (-not ($rsvars -and (Test-Path $rsvars))) {
            Write-Host "::error::Cannot compile — rsvars.bat not found"
            exit 1
          }
          $projects = @("Janus.Tests.Units", "Janus.Tests.RESTfulDriver")
          $env:CI = "1"
          $failed = @()
          foreach ($project in $projects) {
            Write-Host "::group::$project"
            cmd /c "call `"$rsvars`" && msbuild Test\Delphi\$project.dproj /t:Build /p:Config=Debug /p:Platform=Win32 /verbosity:minimal"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$project failed to compile"
              $failed += "$project (compile)"
              Write-Host "::endgroup::"
              continue
            }
            $exe = Get-ChildItem -Path "Test\Delphi" -Filter "$project.exe" -Recurse | Select-Object -First 1
            if (-not $exe) {
              $exe = Get-ChildItem -Path "." -Filter "$project.exe" -Recurse | Select-Object -First 1
            }
            if (-not $exe) {
              Write-Host "::error::$project.exe not found"
              $failed += "$project (missing exe)"
              Write-Host "::endgroup::"
              continue
            }
            Write-Host "Running: $($exe.FullName)"
            & $exe.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$project tests failed with exit code $LASTEXITCODE"
              $failed += "$project (tests)"
            }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::Failing projects: $($failed -join ', ')"
            exit 1
          }
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dunitx-results
          path: |
            **/dunitx-results.xml
            **/Janus.Tests.Units-*.xml
            **/Janus.Tests.RESTfulDriver-*.xml
          if-no-files-found: warn
